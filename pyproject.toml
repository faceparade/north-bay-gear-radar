[project]
name = "audio-scraper"
version = "0.1.0"
description = "Read-only broad-category local music gear collector"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "websockets>=15",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[project.scripts]
audio-scraper = "audio_scraper.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_scraper"]
